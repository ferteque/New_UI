<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EPGenius EPG Displayer</title>
    <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <style>
        :root {
            --color-bg-dark-start: #1e1e1e;
            --color-bg-dark-end: #2b2b2b;
            --color-bg-light-start: #f4f4f4;
            --color-bg-light-end: #e6e6e6;
            --color-primary: #00e5ff;
            --color-primary-hover: #00bcd4;
            --color-text-dark: #fff;
            --color-text-light: #000;
            --color-text-muted-dark: #ccc;
            --color-text-muted-light: #333;
            --color-bg-input-dark: #444;
            --color-border-input-dark: #777;
            --color-bg-controls-dark: #2e2e2e;
            --color-bg-controls-light: #ddd;
            --color-bg-card-dark: #1a1a1a;
            --color-bg-card-light: #fff;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--color-text-dark);
            background: linear-gradient(180deg, var(--color-bg-dark-start), var(--color-bg-dark-end));
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            color: var(--color-primary);
            margin-bottom: 20px;
        }

        #dateFilter {
            width: auto;
            min-width: 110px;
            max-width: 140px;
            padding: 6px 8px;
            font-size: 0.95em;
            box-sizing: border-box;
        }

        #hourFilter {
            width: auto;
            min-width: 90px;
            max-width: 120px;
            padding: 6px 8px;
            font-size: 0.85em;
            box-sizing: border-box;
        }

        #resetFiltersBtn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            padding: 0;
            font-size: 1.2em;
            line-height: 36px;
            text-align: center;
            cursor: pointer;
            border: none;
            background-color: var(--color-primary);
            color: #000;
            transition: background-color 0.3s;
            margin-left: 6px;
        }

        #resetFiltersBtn:hover {
            background-color: var(--color-primary-hover);
        }


        #controls {
            margin-bottom: 25px;
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            /* background: var(--color-bg-controls-dark); */
            /* box-shadow: 0 0 8px rgba(0, 0, 0, 0.3); */
        }

        input[type="text"],
        select {
            padding: 10px;
            margin: 8px;
            border-radius: 6px;
            border: 1px solid var(--color-border-input-dark);
            background-color: var(--color-bg-input-dark);
            color: var(--color-text-dark);
            font-size: 0.95em;
            cursor: text;
        }

        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: var(--color-primary);
        }

        button {
            font-size: 1em;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background-color: var(--color-primary);
            color: #000;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: var(--color-primary-hover);
        }

        button:disabled {
            background-color: #666;
            cursor: not-allowed;
        }

        #result-count {
            text-align: center;
            margin: 15px 0;
            font-size: 0.95em;
            color: var(--color-text-muted-dark);
        }

        label {
            font-size: 0.95em;
            color: #ddd;
        }

        .pagination-btn {
            margin: 10px 5px;
        }

        #data-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-top: 10px;
        }

        .program-card {
            background-color: var(--color-bg-card-dark);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 229, 255, 0.3);
            display: flex;
            flex-direction: column;
            color: var(--color-text-dark);
            transition: box-shadow 0.3s ease;
        }

        .program-card:hover {
            box-shadow: 0 4px 16px rgba(0, 229, 255, 0.6);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: nowrap;
            margin-bottom: 12px;
        }

        .card-info {
            display: flex;
            gap: 10px;
            align-items: baseline;
            color: var(--color-text-muted-dark);
            font-size: 0.9em;
            flex-wrap: wrap;
        }

        .card-date {
            display: block;
            font-weight: bold;
            color: var(--color-primary);
            font-size: 1.0em;
        }

        .card-time {
            display: block;
            color: var(--color-text-dark);
            font-weight: bold;
            font-size: 0.9em;
        }

        .card-time .duration {
            font-size: 0.8em;
            color: var(--color-text-muted-dark);
            margin-left: 5px;
        }

        .card-channel {
            display: flex;
            align-items: center;
            min-width: 120px;
            flex-direction: row;
        }

        .card-channel img {
            margin-right: 2px;
            height: 32px;
            width: auto;
            max-width: 60px;
            object-fit: contain;
            border-radius: 1px;
            margin: 5;
            padding: 0;
        }

        .channel-name {
            font-size: 0.65em;
            color: var(--color-text-muted-dark);
            margin-right: 1px;
        }

        .card-body {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .card-images {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .card-images img {
            width: 90px;
            border-radius: 6px;
            object-fit: contain;
        }

        .card-text {
            flex: 1;
            min-width: 200px;
        }

        .card-text .title {
            font-weight: bold;
            font-size: 1em;
            margin-bottom: 5px;
            color: var(--color-text-dark);
        }

        .card-text .description {
            font-size: 0.85em;
            color: var(--color-text-muted-dark);
            white-space: pre-wrap;
        }

        #top-buttons {
            display: inline-flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: nowrap;
            /* que no se envuelvan */
        }

        input[type="text"],
        select,
        input[type="date"],
        input[type="number"] {
            padding: 10px;
            margin: 8px;
            border-radius: 6px;
            border: 1px solid var(--color-border-input-dark);
            background-color: var(--color-bg-input-dark);
            color: var(--color-text-dark);
            font-size: 0.95em;
            cursor: text;
        }

        #date-hour-filters {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 15px 0;
        }

        #date-hour-filters input,
        #date-hour-filters select {
            flex: 1;
            min-width: 150px;
        }


        /* Loader spinner styles moved to CSS */
        #loader-spinner {
            display: inline-block;
            border: 4px solid var(--color-primary);
            border-top: 4px solid transparent;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        /* Light mode overrides */
        body.light-mode {
            background: linear-gradient(180deg, var(--color-bg-light-start), var(--color-bg-light-end));
            color: var(--color-text-light);
        }

        body.light-mode .program-card {
            background-color: var(--color-bg-card-light);
            color: var(--color-text-light);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            /* Sombra más suave para modo claro */
        }

        body.light-mode .program-card:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            /* Sombra más suave al pasar el ratón */
        }

        body.light-mode .card-date,
        body.light-mode .card-time,
        body.light-mode .card-text .title {
            color: var(--color-text-light);
        }

        body.light-mode .card-text .description,
        body.light-mode .channel-name,
        body.light-mode #result-count {
            color: var(--color-text-muted-light);
        }

        body.light-mode button {
            background-color: var(--color-primary-hover);
            color: var(--color-text-light);
            /* Asegura texto oscuro en botones claros */
        }

        /* Light mode overrides */
        body.light-mode {
            background: linear-gradient(180deg, var(--color-bg-light-start), var(--color-bg-light-end));
            color: var(--color-text-light);
            /* Texto principal oscuro */
        }

        body.light-mode .program-card {
            background-color: var(--color-bg-card-light);
            /* Fondo de la tarjeta blanca */
            color: var(--color-text-light);
            /* Texto de la tarjeta oscuro */
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            /* Sombra más suave para modo claro */
        }

        body.light-mode .program-card:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            /* Sombra más suave al pasar el ratón */
        }

        body.light-mode .card-date,
        body.light-mode .card-time,
        body.light-mode .card-text .title {
            color: var(--color-text-light);
            /* Asegura que la fecha, hora y título sean oscuros */
        }

        body.light-mode .card-text .description,
        body.light-mode .channel-name,
        body.light-mode #result-count {
            color: var(--color-text-muted-light);
            /* Texto muteado más oscuro */
        }

        body.light-mode button {
            background-color: var(--color-primary-hover);
            /* Fondo del botón primario claro */
            color: var(--color-text-light);
            /* Texto oscuro en botones claros */
        }

        /* --- Estilos para los Controles (filtros) en modo claro --- */
        body.light-mode input[type="text"],
        body.light-mode select,
        body.light-mode input[type="date"],
        body.light-mode input[type="number"] {
            background-color: var(--color-bg-controls-light);
            /* Fondo más claro para inputs/selects */
            border-color: var(--color-border-input-dark);
            /* Borde que contraste */
            color: var(--color-text-light);
            /* Texto oscuro en inputs */
        }

        body.light-mode input[type="text"]:focus,
        body.light-mode select:focus,
        body.light-mode input[type="date"]:focus,
        body.light-mode input[type="number"]:focus {
            outline: none;
            border-color: var(--color-primary);
            /* Borde al enfocar, usando el color primario */
        }

        body.light-mode #controls {
            background: var(--color-bg-controls-light);
            /* Fondo para la sección de controles */
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.1);
            /* Sombra suave para controles */
        }

        body.light-mode label {
            /* Asegura el color del texto de la etiqueta en modo claro */
            color: var(--color-text-muted-light);
        }

        body.light-mode #resetFiltersBtn {
            background-color: var(--color-primary);
            /* Color del botón de reset */
            color: #000;
            /* Texto negro */
        }

        body.light-mode #resetFiltersBtn:hover {
            background-color: var(--color-primary-hover);
            /* Hover para el botón de reset */
        }

        /* --- Estilos de la Grilla en modo claro --- */
        body.light-mode #grid-container table {
            border: 1px solid var(--color-border-input-dark);
            /* Borde exterior de la tabla */
        }

        body.light-mode #grid-container th {
            background-color: var(--color-bg-controls-light);
            /* Fondo de los encabezados de la tabla */
            color: var(--color-text-light);
            /* Texto de los encabezados */
            border: 1px solid var(--color-border-input-dark);
        }

        body.light-mode #grid-container td {
            border: 1px solid var(--color-border-input-dark);
            /* Borde de las celdas de la grilla */
            color: var(--color-text-light);
            background-color: #ffffff;
            /* Las celdas VACÍAS por defecto serán BLANCAS */
        }

        body.light-mode #grid-container td[style*="background: rgb(51, 51, 51)"] {
            /* Celda con PROGRAMA (en modo oscuro tenía #333) */
            background-color: #f0f0f0 !important;
            /* Fondo GRIS CLARO para las celdas con CONTENIDO de programa */
            color: var(--color-text-light);
        }

        body.light-mode #grid-container td[style*="background: rgb(34, 34, 34)"] {
            /* Celda del CANAL (en modo oscuro tenía #222) */
            background-color: #e0e0e0 !important;
            /* Fondo GRIS MEDIO para el nombre del canal */
            color: var(--color-text-light);
        }

        body.light-mode #grid-container td>div {
            /* Título del programa en grilla */
            color: var(--color-text-light);
        }

        body.light-mode #grid-container td>div:last-child {
            /* Hora del programa en grilla */
            color: var(--color-text-light) !important;
            /* <--- ¡AÑADIDO !important! */
        }

        /* --- Estilos del Loader en modo claro --- */
        body.light-mode #loader-spinner {
            border-color: var(--color-primary-hover);
            /* Color del spinner */
            border-top-color: transparent;
        }

        body.light-mode #loader p {
            color: var(--color-text-muted-light) !important;
            /* Texto del loader */
        }

        /* Responsive styles */
        @media (max-width: 768px) {
            body.light-mode .card-date {
                color: var(--color-text-muted-light) !important;
                /* Asegura el color en la vista de lista */
            }

            .card-body {
                flex-direction: column;
                align-items: flex-start;
            }

            .card-images {
                flex-direction: row;
                gap: 10px;
            }

            .card-images img {
                width: 70px;
                height: 90px;
                max-width: auto;
                width: auto;
                border-radius: 6px;
                object-fit: cover;
            }

            .card-channel {
                flex-direction: column-reverse;
                align-items: center;
            }

            input[type="text"],
            select,
            button {
                width: 90%;
                margin: 5px auto;
                display: block;
            }

            #controls {
                padding: 10px;
            }

            .card-info {
                flex-direction: column;
                align-items: flex-start;
            }

            .card-time {
                margin-top: 4px;
            }

        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>

</head>

<body>
    <h1>EPGenius EPG Displayer</h1>

    <div id="top-buttons" style="text-align: center; margin-bottom: 20px; display: flex; justify-content: center; gap: 15px; flex-wrap: nowrap;">
        <button onclick="toggleDarkMode()" id="themeToggleBtn" title="Cambiar tema">🌙</button>
        <button onclick="fetchXML()" id="reloadBtn" title="Recargar EPG">🔃</button>
    </div>

    <div id="controls">
        <select id="categoryDropdown">
        </select>
        <input type="text" id="channelFilter" placeholder="Filter by channel" />
        <input type="text" id="titleFilter" placeholder="Filter by title" />
        <input type="text" id="descriptionFilter" placeholder="Filter by description" />
        <div id="dateHourGroup" style="display: inline-flex; gap: 8px; align-items: center;">
            <input type="date" id="dateFilter" />
            <button id="resetFiltersBtn" title="Resetear filtros">✖️️</button>
        </div>

    </div>

    <div id="loader" style="display: none; text-align:center; margin-top:20px;">
        <span id="loader-spinner"></span>
        <p style="color:#ccc;">Loading EPG...</p>
    </div>

    <div id="grid-container" style="margin-top: 30px;"></div>


    


    <div id="data-list"></div>
    <div id="result-count"></div>

    <script>
(function() {

            // ════════════════════════════════════════════════════════════════
            // TIMEZONE & DATE UTILITIES
            // ════════════════════════════════════════════════════════════════

            function parseXMLTVToUTCDate(xmltv) {
                if (!xmltv) return null;
                const m = xmltv.match(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})\s?([+\-]\d{4})?$/);
                if (!m) return null;
                const [, y, mo, d, hh, mm, ss, tz] = m;
                let iso = `${y}-${mo}-${d}T${hh}:${mm}:${ss}`;
                iso += tz ? (tz.slice(0, 3) + ':' + tz.slice(3)) : 'Z';
                const date = new Date(iso);
                return isNaN(date.getTime()) ? null : date;
            }

            function localDayString(offsetDays) {
                const d = new Date();
                d.setDate(d.getDate() + (offsetDays || 0));
                return d.toLocaleDateString('sv-SE');
            }

            function getLocalDayBounds(ymd) {
                const dayStart = new Date(ymd + 'T00:00:00');
                const dayEnd   = new Date(ymd + 'T00:00:00');
                dayEnd.setDate(dayEnd.getDate() + 1);
                return { dayStart, dayEnd };
            }

            function minsToHHMM(mins) {
                const h = Math.floor(Math.max(0, mins) / 60) % 24;
                const m = Math.max(0, mins) % 60;
                return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
            }

            function getCurrentDateFormatted() { return localDayString(0); }
            function setDateToCurrent() {
                document.getElementById('dateFilter').value = getCurrentDateFormatted();
            }

            // ════════════════════════════════════════════════════════════════
            // ESTAT GLOBAL
            // ════════════════════════════════════════════════════════════════

            const TVState = {
                channelCategories: {},
                categoriesList: [],
                channelsOrder: [],
                channelInfoMap: {},
                channelsList: [],
                rawProgrammes: [],
                // Índex: channelId → [programa, programa, ...]  (construït 1 sola vegada)
                epgIndex: {},
                epgData: [],
                epgChannels: [],
                epgProgrammes: [],
                isEPGLoading: false,
                isM3ULoading: false
            };

            let filteredData = [];
            // Cancel·lació del render en curs
            let renderGeneration = 0;

            // ════════════════════════════════════════════════════════════════
            // PROGRESS UI  (barra + label)
            // ════════════════════════════════════════════════════════════════

            function ensureProgressUI() {
                if (document.getElementById('epg-progress')) return;
                const container = document.createElement('div');
                container.id = 'epg-progress';
                container.style.cssText = 'position:fixed;left:20px;right:20px;bottom:20px;height:12px;background:#222;border:1px solid #444;border-radius:6px;z-index:9999;box-shadow:0 2px 10px rgba(0,0,0,.4)';
                const fill = document.createElement('div');
                fill.id = 'epg-progress-fill';
                fill.style.cssText = 'height:100%;width:0%;border-radius:6px;transition:width .15s linear;background:linear-gradient(90deg,#4caf50,#81c784)';
                container.appendChild(fill);
                const label = document.createElement('div');
                label.id = 'epg-progress-label';
                label.style.cssText = 'position:absolute;top:-22px;left:0;right:0;text-align:center;font:12px system-ui,sans-serif;color:#ddd';
                label.textContent = 'Loading EPG…';
                container.appendChild(label);
                document.body.appendChild(container);
            }

            function updateProgressUI(pct, text) {
                const fill  = document.getElementById('epg-progress-fill');
                const label = document.getElementById('epg-progress-label');
                if (fill)  fill.style.width = `${Math.max(0, Math.min(100, pct))}%`;
                if (label) label.textContent = text || `Loading… ${Math.round(pct)}%`;
            }

            function hideProgressUI() {
                const bar = document.getElementById('epg-progress');
                if (bar) bar.remove();
            }

            // Helper: cedeix el control al navegador (permet repintar UI)
            function yieldToUI() {
                return new Promise(resolve => setTimeout(resolve, 0));
            }

            // ════════════════════════════════════════════════════════════════
            // PARSE M3U
            // ════════════════════════════════════════════════════════════════

            function parseM3U(m3uText) {
                const mapping = {}, channelInfoMap = {}, channelsList = [], channelsOrder = [];
                const categoriesList = [], seenCategories = new Set();
                if (!m3uText) return { mapping, categoriesList, channelsList, channelInfoMap, channelsOrder };
                let noIdCounter = 0;
                for (const rawLine of m3uText.split(/\r?\n/)) {
                    const line = rawLine.trim();
                    if (!line.startsWith('#EXTINF')) continue;
                    const tvgIdMatch = line.match(/tvg-id="([^"]*)"/i);
                    const groupMatch = line.match(/group-title="([^"]*)"/i);
                    const logoMatch  = line.match(/tvg-logo="([^"]*)"/i);
                    const nameMatch  = line.split(',').pop().trim();
                    const id   = (tvgIdMatch && tvgIdMatch[1]) ? tvgIdMatch[1] : `no-id-${noIdCounter++}`;
                    const grp  = groupMatch ? groupMatch[1] : '';
                    const logo = logoMatch  ? logoMatch[1]  : '';
                    const name = nameMatch || id;
                    mapping[id] = grp;
                    channelInfoMap[id] = { name, category: grp, iconSrc: logo };
                    channelsList.push({ id, name, category: grp, iconSrc: logo });
                    channelsOrder.push(id);
                    if (grp && !seenCategories.has(grp)) { seenCategories.add(grp); categoriesList.push(grp); }
                }
                return { mapping, categoriesList, channelsList, channelInfoMap, channelsOrder };
            }

            function populateCategoryDropdown() {
                const dropdown = document.getElementById('categoryDropdown');
                if (!dropdown) return;
                dropdown.innerHTML = '';
                TVState.categoriesList.forEach(cat => {
                    const o = document.createElement('option');
                    o.value = o.textContent = cat;
                    dropdown.appendChild(o);
                });
                if (dropdown.options.length > 0) dropdown.selectedIndex = 0;
            }

            function processColoredText(text) {
                if (!text) return '';
                return String(text).replace(/\[COLOR\s*(\w+)\](.*?)\[\/COLOR\]/g,
                    (_, c, t) => `<span style="color:${c}">${t}</span>`);
            }

            // ════════════════════════════════════════════════════════════════
            // CONSTRUIR epgIndex i epgData  (async, amb progress)
            // ════════════════════════════════════════════════════════════════

            /**
             * Construeix TVState.epgIndex (Map channelId → llista de programes processats)
             * i TVState.epgData (llista plana ordenada) de forma ASÍNCRONA per no congelar la UI.
             *
             * Crida onDone() quan acaba.
             */
            async function buildEPGDataForDay(selectedDateYMD, onDone) {
                TVState.epgData  = [];
                TVState.epgIndex = {};

                const todayYMD = localDayString(0);
                if (selectedDateYMD !== todayYMD) {
                    // Dia diferent: sense dades, mostrarem placeholders
                    if (onDone) onDone();
                    return;
                }

                const { dayStart, dayEnd } = getLocalDayBounds(selectedDateYMD);
                const dayStartMs = dayStart.getTime();
                const dayEndMs   = dayEnd.getTime();

                // Construïm un Map ràpid channelId → channelInfo (evita .find() O(n) per programa)
                const channelMap = new Map();
                for (const ch of TVState.channelsList) channelMap.set(ch.id, ch);

                const BATCH = 5000;
                const total = TVState.rawProgrammes.length;
                const result = [];

                ensureProgressUI();
                updateProgressUI(0, `Processing programmes… 0 / ${total}`);

                for (let i = 0; i < total; i += BATCH) {
                    const end = Math.min(i + BATCH, total);
                    for (let j = i; j < end; j++) {
                        const raw = TVState.rawProgrammes[j];

                        const startUTC = parseXMLTVToUTCDate(raw.start);
                        let   endUTC   = parseXMLTVToUTCDate(raw.stop);
                        if (!startUTC || !endUTC) continue;

                        let endMs = endUTC.getTime();
                        const startMs = startUTC.getTime();

                        // Dada malformada
                        if (endMs <= startMs) endMs += 86400000;

                        // No es solapa amb el dia?
                        if (endMs <= dayStartMs || startMs >= dayEndMs) continue;

                        // Retalla
                        const clippedStartMs = startMs < dayStartMs ? dayStartMs : startMs;
                        const clippedEndMs   = endMs   > dayEndMs   ? dayEndMs   : endMs;

                        const startMins = Math.round((clippedStartMs - dayStartMs) / 60000);
                        const endMins   = Math.round((clippedEndMs   - dayStartMs) / 60000);
                        const duration  = endMins - startMins;
                        if (duration <= 0) continue;

                        const channelInfo = channelMap.get(raw.channel) || {};
                        const category    = TVState.channelCategories[raw.channel] || channelInfo.category || '';

                        result.push({
                            channel:     raw.channel,
                            channelIcon: channelInfo.iconSrc || '',
                            category,
                            date:        selectedDateYMD.split('-').reverse().join('/'),
                            start:       minsToHHMM(startMins),
                            stop:        minsToHHMM(endMins),
                            __startMins: startMins,
                            __endMins:   endMins,
                            duration,
                            iconSrc:     raw.iconSrc  || '',
                            iconSrc2:    raw.iconSrc2 || '',
                            title:       raw.title,
                            description: raw.description
                        });
                    }

                    const pct = Math.round((end / total) * 80); // reservem 20% per l'ordenació
                    updateProgressUI(pct, `Processing programmes… ${end} / ${total}`);
                    await yieldToUI(); // cedim control → UI es pot repintar
                }

                updateProgressUI(80, 'Sorting…');
                await yieldToUI();

                // Ordena per l'ordre del M3U
                const orderMap = new Map(TVState.channelsOrder.map((id, i) => [id, i]));
                result.sort((a, b) => (orderMap.get(a.channel) ?? 99999) - (orderMap.get(b.channel) ?? 99999));

                TVState.epgData = result;

                // Construeix índex channelId → [programes]  (evita .filter() O(n) per canal al render)
                updateProgressUI(90, 'Indexing…');
                await yieldToUI();

                const idx = {};
                for (const p of result) {
                    if (!idx[p.channel]) idx[p.channel] = [];
                    idx[p.channel].push(p);
                }
                TVState.epgIndex = idx;

                updateProgressUI(100, 'Ready');
                await yieldToUI();

                if (onDone) onDone();
            }

            // ════════════════════════════════════════════════════════════════
            // PARSE XML / JSON  (punt d'entrada des del worker)
            // ════════════════════════════════════════════════════════════════

            function parseXML(xmlOrJson) {
                let channelElements = [];
                let programmes = [];

                if (typeof xmlOrJson === 'string') {
                    const parser = new DOMParser();
                    const xmlDoc = parser.parseFromString(xmlOrJson, 'application/xml');
                    if (xmlDoc.querySelector('parsererror')) throw new Error("XML errors.");
                    channelElements = Array.from(xmlDoc.getElementsByTagName('channel'));
                    programmes      = Array.from(xmlDoc.getElementsByTagName('programme'));
                } else {
                    channelElements = xmlOrJson.channels   || [];
                    programmes      = xmlOrJson.programmes || [];
                }

                // ── Canals ────────────────────────────────────────────────────
                const xmlChannelInfoMap = {};
                if (typeof xmlOrJson === 'string') {
                    channelElements.forEach(ch => {
                        const id = ch.getAttribute('id');
                        if (!id) return;
                        xmlChannelInfoMap[id] = {
                            name:    ch.querySelector('display-name')?.textContent?.trim() || '',
                            iconSrc: ch.querySelector('icon')?.getAttribute('src') || ''
                        };
                    });
                } else {
                    channelElements.forEach(ch => {
                        xmlChannelInfoMap[ch.id] = { name: ch.name, iconSrc: ch.iconSrc };
                    });
                }

                if (!TVState.channelsList || TVState.channelsList.length === 0) {
                    TVState.channelsList = Object.entries(xmlChannelInfoMap).map(([id, info]) => ({
                        id, name: info.name || id, iconSrc: info.iconSrc || '', category: ''
                    }));
                    TVState.channelsOrder = TVState.channelsList.map(ch => ch.id);
                    TVState.categoriesList = [];
                    populateCategoryDropdown();
                } else {
                    TVState.channelsList = TVState.channelsList.map(ch => {
                        const xi = xmlChannelInfoMap[ch.id] || {};
                        return { ...ch, name: ch.name || xi.name || '', iconSrc: ch.iconSrc || xi.iconSrc || '' };
                    });
                }

                // ── rawProgrammes: còpia lleugera dels objectes del worker ────
                // (ja són objectes JS plans, no cal re-mapejar si vénen del worker)
                TVState.rawProgrammes = programmes.map(p => ({
                    channel:     p.channel     || p.getAttribute?.('channel') || '',
                    start:       p.start       || p.getAttribute?.('start')   || '',
                    stop:        p.stop        || p.getAttribute?.('stop')    || '',
                    title:       String(p.title       || p.getElementsByTagName?.('title')[0]?.textContent || ''),
                    description: String(p.description || p.getElementsByTagName?.('desc')[0]?.textContent  || ''),
                    iconSrc:     p.iconSrc     || p.getElementsByTagName?.('icon')[0]?.getAttribute?.('src')  || '',
                    iconSrc2:    p.iconSrc2    || p.getElementsByTagName?.('icon2')[0]?.getAttribute?.('src') || ''
                }));

                TVState.isEPGLoading = true;
                ensureProgressUI();
                updateProgressUI(0, 'Processing programmes…');

                const selectedDate = document.getElementById('dateFilter').value || getCurrentDateFormatted();

                buildEPGDataForDay(selectedDate, () => {
                    TVState.isEPGLoading = false;
                    hideProgressUI();
                    document.getElementById('loader').style.display = 'none';
                    document.querySelector('button[onclick="fetchXML()"]').disabled = false;
                    renderTable(false, 200, true);
                });
            }

            // ════════════════════════════════════════════════════════════════
            // RENDER TABLE
            // ════════════════════════════════════════════════════════════════

            function renderTable(clear = false, pageSize = 200, allowEmpty = true) {
                const categoryFilter    = document.getElementById('categoryDropdown').value.toLowerCase().trim();
                const channelFilter     = document.getElementById('channelFilter').value.toLowerCase().trim();
                const titleFilter       = document.getElementById('titleFilter').value.toLowerCase().trim();
                const descriptionFilter = document.getElementById('descriptionFilter').value.toLowerCase().trim();
                const selectedDate      = document.getElementById('dateFilter').value || getCurrentDateFormatted();
                const isToday           = selectedDate === localDayString(0);

                const candidateChannels = TVState.channelsList.filter(ch => {
                    if (categoryFilter && !(ch.category || '').toLowerCase().includes(categoryFilter)) return false;
                    if (channelFilter  && !(ch.name     || '').toLowerCase().includes(channelFilter))  return false;
                    return true;
                });

                const grouped = [];

                for (const ch of candidateChannels) {
                    let programs;

                    if (!isToday) {
                        programs = [];
                    } else {
                        // Ús de l'índex: O(1) lookup + filter només sobre els programes del canal
                        const chanProgs = TVState.epgIndex[ch.id] || [];
                        programs = chanProgs.filter(p => {
                            if (titleFilter       && !(p.title       || '').toLowerCase().includes(titleFilter))       return false;
                            if (descriptionFilter && !(p.description || '').toLowerCase().includes(descriptionFilter)) return false;
                            return true;
                        });
                    }

                    grouped.push({
                        channel:  ch,
                        programs: programs.length ? programs : [{
                            title: 'Loading EPG...', start: '00:00', stop: '24:00',
                            __startMins: 0, __endMins: 24 * 60, __placeholder: true
                        }]
                    });
                }

                filteredData = grouped;
                renderGridView();
            }

            // ════════════════════════════════════════════════════════════════
            // RENDER GRID VIEW  (async per batches, cancel·lable)
            // ════════════════════════════════════════════════════════════════

            function renderGridView() {
                const container = document.getElementById('grid-container');
                if (!container) return;

                // Incrementem la generació per cancel·lar qualsevol render anterior en curs
                renderGeneration++;
                const myGen = renderGeneration;

                const selectedCategory = document.getElementById('categoryDropdown').value.toLowerCase().trim();
                const COLUMN_WIDTH     = 215;
                const ROW_HEIGHT       = 80;
                const DAY_MINUTES      = 24 * 60;
                const MIN_PROG_WIDTH   = 4;

                const displayedData = filteredData.filter(({ channel }) => {
                    const cat = (channel.category || '').toLowerCase().trim();
                    return !selectedCategory || cat === selectedCategory;
                });

                // ── Estructura principal ─────────────────────────────────────
                const mainContainer = document.createElement('div');
                mainContainer.className = 'epg-main-container';
                mainContainer.style.cssText = 'width:100%;height:calc(100vh - 100px);display:flex;flex-direction:column';

                const scrollBarContainer = document.createElement('div');
                scrollBarContainer.style.cssText = 'height:10px;background:#f0f0f0;border-bottom:1px solid #ddd;position:relative';
                const scrollThumb = document.createElement('div');
                scrollThumb.className = 'epg-scroll-thumb';
                scrollThumb.style.cssText = 'height:100%;background:#888;border-radius:5px;position:absolute;cursor:grab;width:100px';
                scrollBarContainer.appendChild(scrollThumb);
                mainContainer.appendChild(scrollBarContainer);

                const tableContainer = document.createElement('div');
                tableContainer.className = 'epg-table-container';
                tableContainer.style.cssText = 'flex-grow:1;overflow:auto;position:relative';
                mainContainer.appendChild(tableContainer);

                const grid = document.createElement('div');
                grid.style.cssText = `display:flex;flex-direction:column;width:${25 * COLUMN_WIDTH}px;position:absolute`;

                // ── Header d'hores ───────────────────────────────────────────
                const header = document.createElement('div');
                header.style.cssText = `display:flex;height:50px;position:sticky;top:0;background:linear-gradient(#333,#222);z-index:100`;
                const hCell = document.createElement('div');
                hCell.style.cssText = `width:${COLUMN_WIDTH}px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;border-right:1px solid #444`;
                hCell.textContent = 'Channels';
                header.appendChild(hCell);
                for (let h = 0; h < 24; h++) {
                    const hc = document.createElement('div');
                    hc.style.cssText = `width:${COLUMN_WIDTH}px;display:flex;align-items:center;justify-content:center;border-right:1px solid #444;color:#fff`;
                    hc.textContent = `${String(h).padStart(2,'0')}:00`;
                    header.appendChild(hc);
                }
                grid.appendChild(header);

                // Posem ja el grid al DOM perquè l'usuari vegi el header mentre es carreguen les files
                tableContainer.appendChild(grid);
                container.replaceChildren(mainContainer);

                const totalChannels = displayedData.length;
                let channelIndex    = 0;

                document.getElementById('loader').style.display = 'block';
                ensureProgressUI();
                updateProgressUI(0, `Rendering… 0 / ${totalChannels} channels`);

                function renderNextBatch() {
                    // Si s'ha iniciat un render nou, abandonem aquest
                    if (myGen !== renderGeneration) return;

                    if (channelIndex >= totalChannels) {
                        // ── Fi del render ────────────────────────────────────
                        TVState.isM3ULoading = false;
                        hideProgressUI();
                        document.getElementById('loader').style.display = 'none';

                        const totalProgs = displayedData.reduce((a, c) => a + c.programs.length, 0);
                        document.getElementById('result-count').textContent =
                            `${grid.querySelectorAll('.program').length} of ${totalProgs} programs`;

                        // Scrollbar superior
                        setTimeout(() => {
                            const gridW     = grid.offsetWidth;
                            const contW     = tableContainer.offsetWidth;
                            const maxScroll = Math.max(1, gridW - contW);
                            function updateThumb() {
                                const sl  = tableContainer.scrollLeft;
                                const pos = (sl / maxScroll) * Math.max(0, contW - scrollThumb.offsetWidth);
                                scrollThumb.style.left  = `${pos}px`;
                                scrollThumb.style.width = `${Math.max(50, (contW / gridW) * contW)}px`;
                            }
                            let dragging = false, startX = 0, startLeft = 0;
                            scrollThumb.onmousedown = e => {
                                dragging = true; startX = e.clientX;
                                startLeft = parseFloat(scrollThumb.style.left || '0');
                                scrollThumb.style.cursor = 'grabbing'; e.preventDefault();
                            };
                            document.onmousemove = e => {
                                if (!dragging) return;
                                const maxL   = Math.max(0, contW - scrollThumb.offsetWidth);
                                const newL   = Math.max(0, Math.min(maxL, startLeft + (e.clientX - startX)));
                                tableContainer.scrollLeft = (newL / maxL) * maxScroll;
                            };
                            document.onmouseup = () => { dragging = false; scrollThumb.style.cursor = 'grab'; };
                            tableContainer.addEventListener('scroll', updateThumb);
                            updateThumb();
                        }, 50);
                        return;
                    }

                    // Renderitzem un batch de canals i cedim control al navegador
                    const BATCH_SIZE = 10; // prou petit per no congelar, prou gran per ser ràpid
                    const end  = Math.min(channelIndex + BATCH_SIZE, totalChannels);
                    const frag = document.createDocumentFragment();

                    for (; channelIndex < end; channelIndex++) {
                        const { channel, programs } = displayedData[channelIndex];

                        const row = document.createElement('div');
                        row.style.cssText = `display:flex;height:${ROW_HEIGHT}px;position:relative;border-bottom:1px solid #444;background:linear-gradient(#1a1a1a,#111)`;

                        // Cel·la del canal
                        const chCell = document.createElement('div');
                        chCell.style.cssText = `width:${COLUMN_WIDTH}px;background:#222;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:5px;position:sticky;left:0;z-index:50;border-right:1px solid #444`;
                        if (channel.iconSrc) {
                            const img = document.createElement('img');
                            img.src = channel.iconSrc; img.alt = channel.name;
                            img.style.cssText = 'height:32px;max-width:60px;display:block;margin:0 auto 2px;border-radius:3px';
                            chCell.appendChild(img);
                        }
                        const nameDiv = document.createElement('div');
                        nameDiv.textContent = channel.name;
                        nameDiv.style.cssText = 'font-size:.8em;text-align:center';
                        chCell.appendChild(nameDiv);
                        row.appendChild(chCell);

                        // Contenidor de programes
                        const progContainer = document.createElement('div');
                        progContainer.style.cssText = `position:relative;flex-grow:1;width:${24 * COLUMN_WIDTH}px;height:100%`;

                        // Línies de les hores
                        for (let h = 0; h <= 24; h++) {
                            const line = document.createElement('div');
                            line.style.cssText = `position:absolute;left:${h * COLUMN_WIDTH}px;top:0;bottom:0;width:1px;background:#333;z-index:1`;
                            progContainer.appendChild(line);
                        }

                        // Programes
                        for (const program of programs) {
                            const sMin = program.__startMins ?? 0;
                            const eMin = program.__endMins   ?? DAY_MINUTES;
                            const cS   = Math.max(0, Math.min(DAY_MINUTES, sMin));
                            const cE   = Math.max(0, Math.min(DAY_MINUTES, eMin));
                            const dur  = cE - cS;
                            if (dur <= 0) continue;

                            const left  = (cS  / 60) * COLUMN_WIDTH;
                            const width = Math.max(MIN_PROG_WIDTH, (dur / 60) * COLUMN_WIDTH);

                            const pd = document.createElement('div');
                            pd.className = 'program';
                            pd.style.cssText = `position:absolute;left:${left}px;width:${width}px;top:5px;bottom:5px;background:linear-gradient(#3a4a5a,#2a3a4a);border:1px solid #4a5a6a;border-radius:4px;color:#fff;padding:8px;box-sizing:border-box;overflow:hidden;z-index:10;display:flex;flex-direction:column;justify-content:center;transition:all .2s ease`;

                            const titleD = document.createElement('div');
                            titleD.innerHTML = processColoredText(program.title || '');
                            titleD.style.cssText = 'font-weight:bold;font-size:.9em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis';
                            pd.appendChild(titleD);

                            const timeD = document.createElement('div');
                            timeD.textContent = `${program.start} - ${program.stop}`;
                            timeD.style.cssText = 'font-size:.8em;color:#aab;margin-top:3px';
                            pd.appendChild(timeD);

                            pd.addEventListener('mouseenter', () => {
                                const req  = Math.max(titleD.scrollWidth + 30, timeD.scrollWidth + 30);
                                const maxW = (24 * COLUMN_WIDTH) - left;
                                const newW = Math.min(req, maxW);
                                pd.style.width  = `${newW}px`;
                                pd.style.zIndex = '100';
                                pd.style.boxShadow = '0 0 15px rgba(0,0,0,.5)';
                                if (left + newW > 24 * COLUMN_WIDTH) pd.style.left = `${24 * COLUMN_WIDTH - newW}px`;
                            });
                            pd.addEventListener('mouseleave', () => {
                                pd.style.width     = `${width}px`;
                                pd.style.left      = `${left}px`;
                                pd.style.zIndex    = '10';
                                pd.style.boxShadow = 'none';
                            });

                            progContainer.appendChild(pd);
                        }

                        row.appendChild(progContainer);
                        frag.appendChild(row);
                    }

                    grid.appendChild(frag);

                    const pct = Math.round((channelIndex / totalChannels) * 100);
                    updateProgressUI(pct, `Rendering… ${channelIndex} / ${totalChannels} channels`);

                    // Cedim el control i continuem al proper frame
                    requestAnimationFrame(renderNextBatch);
                }

                renderNextBatch();
            }

            // ════════════════════════════════════════════════════════════════
            // FETCH PRINCIPAL
            // ════════════════════════════════════════════════════════════════

            async function fetchXML(m3uUrl = '', epgUrl = '') {
                const params = new URLSearchParams(window.location.search);
                m3uUrl = m3uUrl || params.get('m3u') || '';
                epgUrl = epgUrl || params.get('epg') || '';

                if (!epgUrl) { alert('EPG URL required'); return; }
                if (!epgUrl.startsWith(window.location.origin)) {
                    epgUrl = `/epg_proxy?url=${encodeURIComponent(epgUrl)}`;
                }

                const loader    = document.getElementById('loader');
                const reloadBtn = document.querySelector('button[onclick="fetchXML()"]');
                if (reloadBtn) reloadBtn.disabled = true;
                if (loader)    loader.style.display = 'block';

                TVState.epgChannels   = [];
                TVState.epgProgrammes = [];
                TVState.rawProgrammes = [];

                try {
                    if (m3uUrl) {
                        ensureProgressUI();
                        updateProgressUI(0, 'Loading M3U…');
                        TVState.isM3ULoading = true;
                        const m3uResp = await fetch(m3uUrl);
                        if (m3uResp.ok) {
                            const m3uResult = parseM3U(await m3uResp.text());
                            TVState.channelCategories = m3uResult.mapping;
                            TVState.categoriesList    = m3uResult.categoriesList;
                            TVState.channelsOrder     = m3uResult.channelsOrder;
                            TVState.channelInfoMap    = m3uResult.channelInfoMap;
                            TVState.channelsList      = m3uResult.channelsList;
                            populateCategoryDropdown();
                        } else {
                            console.warn("M3U not loaded");
                        }
                    }

                    updateProgressUI(10, 'Loading EPG…');
                    const worker = new Worker('/static/epgWorker.js');
                    worker.postMessage({ epgUrl });

                    worker.onmessage = (e) => {
                        const { type, data, message, total } = e.data;
                        if (type === 'channels') {
                            TVState.epgChannels = data;
                            if (!TVState.channelsList || TVState.channelsList.length === 0) {
                                TVState.channelsList   = data.map(ch => ({ id: ch.id, name: ch.name, iconSrc: ch.iconSrc, category: ch.category || '' }));
                                TVState.channelsOrder  = TVState.channelsList.map(ch => ch.id);
                                TVState.categoriesList = [...new Set(data.map(ch => ch.category).filter(Boolean))];
                                populateCategoryDropdown();
                            }
                        } else if (type === 'programmes') {
                            TVState.epgProgrammes.push(...data);
                            updateProgressUI(20, `Receiving EPG… ${TVState.epgProgrammes.length} programmes`);
                        } else if (type === 'stats') {
                            console.info(`[EPG] ${total} programes rebuts del worker`);
                        } else if (type === 'done') {
                            parseXML({ channels: TVState.epgChannels || [], programmes: TVState.epgProgrammes || [] });
                        } else if (type === 'error') {
                            alert('EPG Error: ' + message);
                            if (loader)    loader.style.display = 'none';
                            if (reloadBtn) reloadBtn.disabled = false;
                        }
                    };

                    worker.onerror = (err) => {
                        alert('Worker Error: ' + err.message);
                        if (loader)    loader.style.display = 'none';
                        if (reloadBtn) reloadBtn.disabled = false;
                    };

                } catch (err) {
                    alert('Error: ' + err.message);
                    if (loader)    loader.style.display = 'none';
                    if (reloadBtn) reloadBtn.disabled = false;
                }
            }

            // ════════════════════════════════════════════════════════════════
            // EVENT LISTENERS
            // ════════════════════════════════════════════════════════════════

            function toggleDarkMode() {
                document.body.classList.toggle('light-mode');
                document.getElementById('themeToggleBtn').textContent =
                    document.body.classList.contains('light-mode') ? '☀️' : '🌙';
            }

            document.addEventListener('DOMContentLoaded', () => {
                setDateToCurrent();

                document.getElementById('categoryDropdown').addEventListener('change', () => {
                    renderTable(false, 200, true);
                });

                document.getElementById('resetFiltersBtn').addEventListener('click', () => {
                    document.getElementById('channelFilter').value     = '';
                    document.getElementById('titleFilter').value       = '';
                    document.getElementById('descriptionFilter').value = '';
                    setDateToCurrent();
                    renderTable(false, 200, true);
                });

                const debounce = (fn, delay = 300) => {
                    let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), delay); };
                };

                document.getElementById('dateFilter').addEventListener('change', debounce(() => {
                    const sel = document.getElementById('dateFilter').value || getCurrentDateFormatted();
                    // buildEPGDataForDay és async → passa el render com a callback
                    buildEPGDataForDay(sel, () => renderTable(false, 200, true));
                }));

                ['channelFilter', 'titleFilter', 'descriptionFilter'].forEach(id => {
                    document.getElementById(id).addEventListener('input', debounce(() => {
                        renderTable(false, 200, true);
                    }));
                });

                fetchXML();
            });

            window.toggleDarkMode = toggleDarkMode;
            window.fetchXML = fetchXML;

        })();
    </script>
